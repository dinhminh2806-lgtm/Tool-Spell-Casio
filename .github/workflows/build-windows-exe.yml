
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --clean --onefile --console
          --name Tool-Spell-Casio
          --add-data "chars_hex.json;."
          --add-data "chars_key.json;."
          --add-data "takechars.txt;."
          --add-data "all_hex.json;."
          tool_spell.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Tool-Spell-Casio-Windows
          path: dist/Tool-Spell-Casio.exe
          if-no-files-found: error
